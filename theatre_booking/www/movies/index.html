<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CinéBook — Now Showing</title>
  <meta name="description" content="Book your cinema experience. Browse movies and shows near you." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #08080f; --bg-card: #12121e; --bg-card-hover: #1a1a2e;
      --accent: #e94560; --accent2: #f5a623;
      --text: #f0f0ff; --text-muted: #7a7a9a;
      --border: rgba(255,255,255,0.07);
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }

    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(8,8,15,0.85); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 64px;
    }
    .logo { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-decoration: none; }
    .nav-subtitle { color: var(--text-muted); font-size: 0.8rem; margin-top: 2px; }

    .hero {
      text-align: center; padding: 5rem 2rem 3rem; position: relative; overflow: hidden;
    }
    .hero::before {
      content: ''; position: absolute; top: -60%; left: 50%; transform: translateX(-50%);
      width: 800px; height: 800px;
      background: radial-gradient(circle, rgba(233,69,96,0.12) 0%, transparent 65%);
      pointer-events: none;
    }
    .hero-tag {
      display: inline-block; background: rgba(233,69,96,0.15); color: var(--accent);
      border: 1px solid rgba(233,69,96,0.3); border-radius: 100px;
      padding: 0.35rem 1rem; font-size: 0.78rem; font-weight: 600;
      letter-spacing: 1px; text-transform: uppercase; margin-bottom: 1.2rem;
    }
    .hero h1 { font-size: clamp(2.2rem, 5vw, 3.8rem); font-weight: 900; letter-spacing: -1.5px; line-height: 1.1; margin-bottom: 1rem; }
    .hero h1 span { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .hero p { color: var(--text-muted); font-size: 1.05rem; max-width: 480px; margin: 0 auto; }

    .section { max-width: 1200px; margin: 0 auto; padding: 1rem 2rem 4rem; }
    .section-header { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 2rem; }
    .section-title { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.3px; }
    .section-count { background: rgba(233,69,96,0.15); color: var(--accent); border-radius: 100px; padding: 0.15rem 0.7rem; font-size: 0.8rem; font-weight: 600; }

    .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }

    .movie-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
      overflow: hidden; transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
      cursor: pointer; text-decoration: none; color: inherit; display: flex; flex-direction: column;
    }
    .movie-card:hover { transform: translateY(-6px); box-shadow: 0 24px 48px rgba(0,0,0,0.4); border-color: rgba(233,69,96,0.3); }

    .movie-poster {
      height: 200px; display: flex; align-items: flex-end; padding: 1rem;
      position: relative; overflow: hidden;
    }
    .movie-poster::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 60%); }
    .genre-icon { font-size: 3.5rem; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-60%); opacity: 0.35; filter: blur(1px); }
    .show-badge { position: relative; z-index: 1; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.15); border-radius: 100px; padding: 0.25rem 0.75rem; font-size: 0.72rem; font-weight: 600; color: #fff; backdrop-filter: blur(8px); }

    .movie-body { padding: 1.25rem; flex: 1; display: flex; flex-direction: column; gap: 0.6rem; }
    .movie-title { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.3px; line-height: 1.3; }
    .movie-meta { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .meta-tag { background: rgba(255,255,255,0.07); border-radius: 6px; padding: 0.2rem 0.55rem; font-size: 0.72rem; color: var(--text-muted); font-weight: 500; }

    .movie-footer { padding: 0 1.25rem 1.25rem; }
    .btn-book { display: block; width: 100%; padding: 0.75rem; background: linear-gradient(135deg, var(--accent), #c0263f); color: #fff; border: none; border-radius: 10px; font-size: 0.9rem; font-weight: 700; cursor: pointer; text-align: center; text-decoration: none; letter-spacing: 0.3px; transition: opacity 0.2s, transform 0.15s; }
    .btn-book:hover { opacity: 0.9; transform: scale(1.02); }

    /* Skeleton loader */
    .skeleton-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
    .skeleton-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    .skeleton-poster { height: 200px; background: linear-gradient(90deg, #1a1a2e 25%, #222238 50%, #1a1a2e 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
    .skeleton-body { padding: 1.25rem; display: flex; flex-direction: column; gap: 0.75rem; }
    .skeleton-line { height: 14px; border-radius: 6px; background: linear-gradient(90deg, #1a1a2e 25%, #222238 50%, #1a1a2e 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
    .skeleton-line.short { width: 60%; }
    .skeleton-btn { height: 40px; border-radius: 10px; margin: 0 1.25rem 1.25rem; background: linear-gradient(90deg, #1a1a2e 25%, #222238 50%, #1a1a2e 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    .empty { text-align: center; padding: 5rem 2rem; color: var(--text-muted); }
    .empty .empty-icon { font-size: 4rem; margin-bottom: 1rem; }
    .empty h3 { font-size: 1.2rem; margin-bottom: 0.5rem; color: var(--text); }

    footer { border-top: 1px solid var(--border); text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.82rem; }

    @media (max-width: 600px) { nav { padding: 0 1rem; } .section { padding: 1rem 1rem 3rem; } .movie-grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; } }
  </style>
</head>
<body>

<nav>
  <div>
    <a class="logo" href="/movies">🎬 CinéBook</a>
    <div class="nav-subtitle">Your Cinema, Your Way</div>
  </div>
</nav>

<section class="hero">
  <div class="hero-tag">🎟 Now Showing</div>
  <h1>Book Your<br/><span>Cinema Experience</span></h1>
  <p>Browse the latest movies, pick your show, and grab your seats — all in seconds.</p>
</section>

<div class="section">
  <div class="section-header">
    <span class="section-title">Movies in Theatres</span>
    <span class="section-count" id="movieCount">Loading…</span>
  </div>
  <div id="movieGrid">
    <!-- Skeleton loaders -->
    <div class="skeleton-grid">
      ${[1,2,3,4].map(() => `
        <div class="skeleton-card">
          <div class="skeleton-poster"></div>
          <div class="skeleton-body">
            <div class="skeleton-line"></div>
            <div class="skeleton-line short"></div>
          </div>
          <div class="skeleton-btn"></div>
        </div>`).join('')}
    </div>
  </div>
</div>

<footer>© 2026 CinéBook — Theatre Booking System</footer>

<script>
  const GRADIENTS = [
    'linear-gradient(135deg,#e94560,#9b2335)',
    'linear-gradient(135deg,#7b2ff7,#3a0ca3)',
    'linear-gradient(135deg,#f5a623,#c97a0d)',
    'linear-gradient(135deg,#0fd9a0,#0a8060)',
    'linear-gradient(135deg,#4361ee,#1a2d9e)',
    'linear-gradient(135deg,#e0406a,#7b1fa2)',
  ];
  const GENRE_ICONS = {
    'Action':'⚡','Sci-Fi':'🚀','Comedy':'😂','Romance':'❤️',
    'Horror':'👻','Drama':'🎭','Thriller':'🔪','Animation':'✨','Adventure':'🗺️'
  };

  function formatDuration(seconds) {
    if (!seconds) return '';
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    return h > 0 ? `${h}h ${m}m` : `${m}m`;
  }

  function renderMovies(movies) {
    const grid = document.getElementById('movieGrid');
    const countEl = document.getElementById('movieCount');

    if (!movies || movies.length === 0) {
      countEl.textContent = '0 movies';
      grid.innerHTML = `
        <div class="empty">
          <div class="empty-icon">🎭</div>
          <h3>No movies currently showing</h3>
          <p>Check back later for upcoming shows.</p>
        </div>`;
      return;
    }

    countEl.textContent = `${movies.length} movie${movies.length !== 1 ? 's' : ''}`;

    grid.innerHTML = `<div class="movie-grid">${movies.map((movie, i) => {
      const g = GRADIENTS[i % GRADIENTS.length];
      const icon = GENRE_ICONS[movie.genre] || '🎬';
      const dur = formatDuration(movie.duration);
      const showCount = movie.show_count || 0;
      const encodedName = encodeURIComponent(movie.name);
      return `
        <a class="movie-card" href="/movies/shows?movie=${encodedName}">
          <div class="movie-poster" style="background:${g}">
            <span class="genre-icon">${icon}</span>
            <span class="show-badge">🎬 ${showCount} show${showCount !== 1 ? 's' : ''}</span>
          </div>
          <div class="movie-body">
            <div class="movie-title">${movie.movie_name}</div>
            <div class="movie-meta">
              ${movie.genre ? `<span class="meta-tag">${movie.genre}</span>` : ''}
              ${movie.language ? `<span class="meta-tag">${movie.language}</span>` : ''}
              ${dur ? `<span class="meta-tag">⏱ ${dur}</span>` : ''}
            </div>
          </div>
          <div class="movie-footer">
            <span class="btn-book">Book Seats →</span>
          </div>
        </a>`;
    }).join('')}</div>`;
  }

  async function loadMovies() {
    try {
      const res = await fetch('/api/method/theatre_booking.api.get_movies', {
        headers: { 'X-Frappe-CSRF-Token': 'fetch' }
      });
      const data = await res.json();
      renderMovies(data.message || []);
    } catch (e) {
      document.getElementById('movieCount').textContent = 'Error';
      document.getElementById('movieGrid').innerHTML = `
        <div class="empty">
          <div class="empty-icon">⚠️</div>
          <h3>Could not load movies</h3>
          <p>Please refresh the page.</p>
        </div>`;
    }
  }

  // Load skeleton first, then fetch data
  document.getElementById('movieGrid').innerHTML = `
    <div class="skeleton-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.5rem">
      ${[1,2,3,4].map(() => `
        <div class="skeleton-card">
          <div class="skeleton-poster"></div>
          <div class="skeleton-body">
            <div class="skeleton-line"></div>
            <div class="skeleton-line short"></div>
          </div>
          <div class="skeleton-btn"></div>
        </div>`).join('')}
    </div>`;

  loadMovies();
</script>
</body>
</html>
